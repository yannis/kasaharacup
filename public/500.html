<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Une erreur est survenue / Something went wrong — Kasahara Cup</title>
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f9fafb;
    color: #111827;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  header { background: #b91c1c; height: 4rem; }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem; }
  h1 { font-size: 1.875rem; line-height: 2.25rem; margin: 0 0 0.5rem; }
  p { color: #374151; margin: 0 0 1rem; }
  .status { color: #b91c1c; font-weight: 600; letter-spacing: 0.05em; margin: 0 0 0.25rem; }
  a { color: #b91c1c; }
  section + section { margin-top: 3rem; border-top: 1px solid #e5e7eb; padding-top: 3rem; }
  footer { max-width: 42rem; margin: 0 auto; padding: 0 1.5rem 3rem; color: #6b7280; font-size: 0.875rem; }
</style>
</head>
<body>
<header></header>
<main>
  <section lang="fr">
    <p class="status">Erreur 500</p>
    <h1>Une erreur est survenue</h1>
    <p>Quelque chose s’est mal passé de notre côté. Merci de réessayer dans un instant.</p>
    <p><a href="/fr">Retour à l’accueil</a></p>
  </section>
  <section lang="en">
    <p class="status">Error 500</p>
    <h1>Something went wrong</h1>
    <p>Something broke on our side. Please try again in a moment.</p>
    <p><a href="/en">Back to the home page</a></p>
  </section>
</main>
<footer>Kasahara Cup</footer>
</body>
</html>
