<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Requête rejetée — Kasahara Cup</title>
<style>
  :root { color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f9fafb;
    color: #111827;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  header { background: #b91c1c; height: 4rem; }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.5rem; }
  h1 { font-size: 1.875rem; line-height: 2.25rem; margin: 0 0 0.5rem; }
  p { color: #374151; margin: 0 0 1rem; }
  .status { color: #b91c1c; font-weight: 600; letter-spacing: 0.05em; margin: 0 0 0.25rem; }
  a { color: #b91c1c; }
  section + section { margin-top: 3rem; border-top: 1px solid #e5e7eb; padding-top: 3rem; }
  footer { max-width: 42rem; margin: 0 auto; padding: 0 1.5rem 3rem; color: #9ca3af; font-size: 0.875rem; }
</style>
</head>
<body>
<header></header>
<main>
  <section lang="fr">
    <p class="status">Erreur 422</p>
    <h1>Requête rejetée</h1>
    <p>La requête a été rejetée. Rechargez la page et réessayez.</p>
    <p><a href="/fr">Retour à l’accueil</a> · <a href="/fr/rules">Règlement de la compétition</a></p>
  </section>
  <section lang="en">
    <p class="status">Error 422</p>
    <h1>Request rejected</h1>
    <p>The request was rejected. Reload the page and try again.</p>
    <p><a href="/en">Back to the home page</a> · <a href="/en/rules">Competition rules</a></p>
  </section>
</main>
<footer>Kasahara Cup</footer>
</body>
</html>
